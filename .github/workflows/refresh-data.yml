name: Refresh game data

on:
  schedule:
    # Mondays at 10:00 UTC — after the weekend's games have been posted.
    - cron: '0 10 * * 1'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the title parsing
        run: python3 scripts/test_parse.py

      - name: Unit tests
        run: npm ci && npm test

      - name: Fetch broadcasts from NSN
        run: python3 scripts/fetch_games.py

      - name: Commit any changes
        id: commit
        run: |
          if git diff --quiet -- docs/data/games.json data/raw_broadcasts.json; then
            echo "No new broadcasts."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/games.json data/raw_broadcasts.json
          git commit -m "Refresh NSN game data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Republish only when the data actually moved.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
