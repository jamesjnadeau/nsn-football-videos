# The site is plain static files in docs/ plus a handful of functions; there is
# no build step, so `command` is intentionally empty.
[build]
  publish = "docs"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Transcript assembly fetches ~757 caption segments per broadcast, which cannot
# fit in a normal function's 26s ceiling.
[functions."transcript-build"]
  background = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
